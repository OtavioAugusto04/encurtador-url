network:
  version: 2
  ethernets:
    enp0s3:
      dhcp4: true
      dhcp4-overrides:
        use-routes: false
        use-dns: false
    enp0s8:
      addresses: [10.20.30.3/24]
      dhcp4: no
      routes:
        - to: default
          via: 10.20.30.1
      nameservers:
        addresses: [8.8.8.8]